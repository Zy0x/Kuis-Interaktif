<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Primary Color & Meta -->
    <meta name="theme-color" content="#2563EB" />
    <meta name="description" content="Kuis SD Seru - Media kuis edukatif interaktif menyenangkan untuk siswa Sekolah Dasar kelas 1-6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kuis SD Seru" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Google Fonts: Quicksand & Nunito (Child Friendly & High Readability) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet" />

    <title>Kuis SD Seru 🌟 Belajar Asyik & Menyenangkan</title>
    <script>
      (function() {
        try {
          var manual = sessionStorage.getItem('kuis_sd_manual_theme');
          var h = new Date().getHours();
          var isDark = manual ? manual === 'dark' : (h >= 18 || h < 7);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-amber-50/40 text-slate-800 antialiased selection:bg-brand-yellow selection:text-slate-900 overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
